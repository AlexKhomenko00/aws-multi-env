name: terraform

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: 1.17.2
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff

  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dir: [org-bucket, org, state-account, security, hub, staging, prod]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/terraform-plugins
          key: terraform-plugins-${{ runner.os }}-${{ matrix.dir }}-${{ hashFiles(format('{0}/.terraform.lock.hcl', matrix.dir)) }}
      - run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform init -backend=false -lockfile=readonly
        env:
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/terraform-plugins
      - run: terraform validate

  tflint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337
        with:
          tflint_version: v0.66.0
          checksums: 22be11cadc25cd02401e94c0ccc91aa63467debb8485c2a755d98f4c0a9d1e2e
          cache: true
      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

  trivy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TRIVY_VERSION: 0.76.2
      TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install trivy
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLo trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz trivy
          echo "$PWD" >> "$GITHUB_PATH"
      - run: trivy config --quiet --skip-check-update --format json --output "$RUNNER_TEMP/trivy.json" .
      - run: trivy convert --quiet --format table --severity UNKNOWN,LOW,MEDIUM "$RUNNER_TEMP/trivy.json"
      - run: trivy convert --quiet --format table --severity HIGH,CRITICAL --exit-code 1 "$RUNNER_TEMP/trivy.json"
